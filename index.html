<style>
  /* ---------- Theme tokens (light default, dark follows the viewer) ---------- */
  :root {
    --bg:#F8FAFC; --surface:#FFFFFF; --ink:#0F172A; --mute:#475569; --line:#E2E8F0; --soft:#EEF2F7;
    --acc:#047857; --gld:#B45309; --hdr:rgba(248,250,252,.94); --danger:#B91C1C;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg:#0B1120; --surface:#111A2E; --ink:#E7ECF4; --mute:#A3B0C4; --line:#22304D; --soft:#0F1930;
      --acc:#34D399; --gld:#FBBF24; --hdr:rgba(11,17,32,.94); --danger:#F87171;
    }
  }
  :root[data-theme="dark"] {
    --bg:#0B1120; --surface:#111A2E; --ink:#E7ECF4; --mute:#A3B0C4; --line:#22304D; --soft:#0F1930;
    --acc:#34D399; --gld:#FBBF24; --hdr:rgba(11,17,32,.94); --danger:#F87171;
  }

  html { scroll-behavior: smooth; }
  body { background: var(--bg); color: var(--ink); }
  h1, h2, h3, .serif { font-family: 'Playfair Display', 'Merriweather', Georgia, serif; }
  main:focus { outline: none; }

  /* ---------- Buttons ---------- */
  .btn { display:inline-flex; align-items:center; justify-content:center; gap:.5rem; padding:.8rem 1.35rem;
    border-radius:10px; font-weight:700; font-size:.92rem; line-height:1.2; text-align:center; cursor:pointer;
    border:2px solid transparent; transition: background-color .15s, color .15s, border-color .15s, transform .15s; }
  .btn:active { transform: translateY(1px); }
  .btn-gold { background:#D97706; color:#0F172A; }
  .btn-gold:hover { background:#F59E0B; }
  .btn-green { background:#047857; color:#fff; }
  .btn-green:hover { background:#065F46; }
  .btn-outline { border-color: currentColor; color: var(--ink); background: transparent; }
  .btn-outline:hover { background: var(--ink); color: var(--bg); }
  .btn-outline-light { border-color: rgba(255,255,255,.55); color:#fff; background: transparent; }
  .btn-outline-light:hover { background:#fff; color:#0F172A; }
  .btn-sm { padding:.55rem 1rem; font-size:.85rem; }
  .btn-xs { padding:.5rem .85rem; font-size:.8125rem; }
  .btn-disabled { opacity:.55; cursor:not-allowed; }

  /* ---------- Forms ---------- */
  .lbl { display:block; font-size:.85rem; font-weight:600; margin-bottom:.35rem; color: var(--ink); }
  .req { color: var(--danger); }
  .input { width:100%; background: var(--surface); color: var(--ink); border:1.5px solid var(--line);
    border-radius:10px; padding:.72rem .9rem; font-size:.95rem; font-family:inherit; }
  .input::placeholder { color: var(--mute); opacity:.75; }
  .input:focus { outline:none; border-color:#059669; box-shadow:0 0 0 3px rgba(5,150,105,.25); }
  .input:disabled { opacity:.55; cursor:not-allowed; }
  textarea.input { resize: vertical; min-height: 110px; }

  /* ---------- Surfaces ---------- */
  .panel { background: var(--surface); border:1px solid var(--line); border-radius:14px; }
  .chip { border:1.5px solid var(--line); background: var(--surface); color: var(--ink); border-radius:10px;
    padding:.8rem .5rem; font-weight:700; font-size:.95rem; cursor:pointer; transition: all .15s; }
  .chip:hover { border-color:#059669; }
  .chip[aria-pressed="true"] { background:#047857; border-color:#047857; color:#fff; }

  /* ---------- Navigation ---------- */
  .navlink { font-size:.8125rem; font-weight:600; padding:.5rem .55rem; border-radius:8px; color: var(--ink);
    border-bottom:2px solid transparent; white-space:nowrap; }
  .navlink:hover { color: var(--acc); }
  .navlink[aria-current="page"] { color: var(--acc); border-bottom-color:#D97706; border-radius:0; }
  .mlink { display:block; padding:.85rem .25rem; font-weight:600; border-bottom:1px solid var(--line); }
  .mlink[aria-current="page"] { color: var(--acc); }

  /* ---------- Hero ---------- */
  .hero { background:
      radial-gradient(900px 500px at 88% 8%, rgba(5,150,105,.28), transparent 60%),
      radial-gradient(700px 420px at -5% 105%, rgba(217,119,6,.18), transparent 60%),
      linear-gradient(135deg, #0F172A 0%, #16295f 55%, #1E3A8A 100%); }
  @keyframes rise { from { opacity:0; transform: translateY(18px); } to { opacity:1; transform:none; } }
  .rise { animation: rise .7s cubic-bezier(.2,.7,.2,1) both; }
  .rise-1 { animation-delay:.05s; } .rise-2 { animation-delay:.18s; } .rise-3 { animation-delay:.3s; } .rise-4 { animation-delay:.42s; }

  /* ---------- Image placeholders (styled containers with visible label text) ---------- */
  .img-slot { position:relative; border-radius:20px; overflow:hidden; display:flex; align-items:center; justify-content:center;
    text-align:center; padding:1.5rem; border:2px dashed rgba(217,119,6,.55); }
  .img-slot .slot-inner { display:flex; flex-direction:column; align-items:center; gap:.6rem; }
  .img-slot .slot-icon { opacity:.7; }
  .img-slot .slot-label { font-weight:700; font-size:.95rem; }
  .img-slot .slot-sub { font-size:.78rem; opacity:.75; max-width:22ch; }
  .img-slot-dark { background: rgba(255,255,255,.05); color:#fff; border-color: rgba(217,119,6,.6); }
  .img-slot-light { background: var(--soft); color: var(--ink); }

  /* ---------- Draft-framework styling (reused for the Movement priorities) ---------- */
  .bill { background: var(--surface); border:1px solid var(--line); border-top: 6px double #B45309; border-radius: 4px 4px 14px 14px; }
  .clause { border-top:1px solid var(--line); }
  .clause:first-child { border-top: 0; }

  .prose-l { max-width: 66ch; line-height: 1.75; }
  .hr-gold { height:3px; width:64px; background:#D97706; border-radius:2px; }

  /* ---------- Card network badges (simplified, generic marks — not brand artwork) ---------- */
  .card-badge { display:inline-flex; align-items:center; justify-content:center; height:30px; padding:0 .65rem;
    border-radius:6px; font-weight:800; font-size:.72rem; letter-spacing:.02em; font-family: Arial, sans-serif; }
  .cb-visa { background:#1A1F71; color:#fff; font-style:italic; }
  .cb-mc { background:#000; color:#fff; display:inline-flex; align-items:center; gap:2px; }
  .cb-mc i { width:14px; height:14px; border-radius:50%; display:inline-block; }
  .cb-amex { background:#2E77BC; color:#fff; }
  .cb-discover { background:#FF6600; color:#fff; }
  .cb-verve { background:#00913F; color:#fff; }

  /* ---------- Campaign seal & banner ---------- */
  .seal-ring { filter: drop-shadow(0 6px 14px rgba(0,0,0,.35)); }
  .badge-card { display:flex; align-items:center; gap:.75rem; border-radius:14px; padding:.6rem .6rem .6rem .5rem;
    background:#fff; color:#0F172A; box-shadow:0 18px 36px -14px rgba(0,0,0,.55); }
  .campaign-banner { position:relative; overflow:hidden; background:

      linear-gradient(120deg, #052e1c 0%, #065F46 55%, #047857 100%); }

  @media (prefers-reduced-motion: reduce) {
    html { scroll-behavior:auto; }
    .rise { animation: none; }

</style>

<script>
(() => {

const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const reduceMotion = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;

/* ---------- Icons (24px stroke set) ---------- */
const ICONS = {

  zap: '<path d="M13 2L3 14h9l-1 8 10-12h-9l1-8z"/>',

const ic = (n, c = 'w-6 h-6') => `<svg class="${c}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${ICONS[n] || ''}</svg>`;

function seal(size = 'w-16 h-16') {

const LOGO = `<svg class="w-9 h-9 shrink-0" viewBox="0 0 40 40" aria-hidden="true"><rect width="40" height="40" rx="9" fill="#0F172A"/><g fill="none" stroke="#F59E0B" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 8v24M12 32h16M9 14h22M12 14l-4 9a4 4 0 0 0 8 0zM28 14l-4 9a4 4 0 0 0 8 0z"/></g></svg>`;

/* ---------- Image placeholder component (Hero + About use this) ---------- */
function imgSlot({ ratio = 'aspect-[4/5]', label, sub, dark = false, cls = '', src = '' }) {
  if (src) {
    return `<img src="${src}" alt="${label}" loading="lazy" decoding="async" class="${ratio} ${cls} object-cover w-full h-full" style="border-radius:10px">`;

  return `<div class="img-slot ${dark ? 'img-slot-dark' : 'img-slot-light'} ${ratio} ${cls}" role="img" aria-label="${label}">
    <div class="slot-inner">
      <span class="slot-icon">${ic('image', 'w-10 h-10')}</span>
      <span class="slot-label">${label}</span>
      ${sub ? `<span class="slot-sub">${sub}</span>` : ''}

    </div>
  </div>`;
}

/* ---------- Form builders ---------- */
const F = {
  text(id, label, o = {}) {
    const req = o.req !== false;
    return `<div><label class="lbl" for="${id}">${label}${req ? ' <span class="req" aria-hidden="true">*</span>' : ''}</label>
      <input class="input" id="${id}" name="${id}" type="${o.type || 'text'}" ${req ? 'required' : ''} data-label="${o.wa || label}"
        autocomplete="${o.ac || 'off'}" ${o.ph ? `placeholder="${o.ph}"` : ''} ${o.disabled ? 'disabled' : ''} ${o.type === 'tel' ? 'inputmode="tel" pattern="[0-9+\\s\\-]{10,16}" title="Enter a valid phone number, e.g. 0801 234 5678"' : ''}></div>`;

  }
};

/* =====================================================================
   ROUTER
   ===================================================================== */
const ROUTES = {
  '/home': ['Home', home], '/about': ['About', about], '/legal': ['Legal Practice', legal],
  '/movement': ["The Movement", movement], '/news': ['News & Updates', news], '/volunteer': ['Volunteer', volunteer],
  '/contact': ['Contact', contact], '/support': ['Support the Movement', support]
};
let firstRender = true;

function route() {
  let p = location.hash.replace(/^#/, '') || '/home';
  if (p === '/') p = '/home';
  if (!ROUTES[p]) p = '/home';
  const [title, render] = ROUTES[p];
  $('#app').innerHTML = render();
  document.title = p === '/home' ? 'Barrister Smiles Azunda | Legal Practitioner & Public Servant' : `${title} | Barrister Smiles Azunda`;
  $$('[data-nav]').forEach(a => a.getAttribute('data-nav') === p ? a.setAttribute('aria-current', 'page') : a.removeAttribute('aria-current'));
  if (!$('#mobileNav').classList.contains('hidden')) $('#menuBtn').click();
  window.scrollTo(0, 0);
  if (!firstRender) $('#app').focus({ preventScroll: true });
  firstRender = false;
  if (p === '/support') setSupport(25000);
  if (p === '/volunteer') wireStateLga();
  runCounters();
}
window.addEventListener('hashchange', route);

function runCounters() {
  if (reduceMotion || !('IntersectionObserver' in window)) return;
  const io = new IntersectionObserver(es => es.forEach(e => {
    if (!e.isIntersecting) return; io.unobserve(e.target);
    const el = e.target, t = +el.dataset.count, s = el.dataset.suffix || '', t0 = performance.now();
    (function step(now) {
      const k = Math.min(1, (now - t0) / 1400);
      el.textContent = Math.round(t * (1 - Math.pow(1 - k, 3))).toLocaleString('en-NG') + s;
      if (k < 1) requestAnimationFrame(step);
    })(t0);
  }), { threshold: 0.6 });
  $$('[data-count]').forEach(el => io.observe(el));
}

/* ---------- Cascading State → LGA ---------- */
function wireStateLga() {
  const stateSel = $('#v_state'), lgaSel = $('#v_lga');
  if (!stateSel || !lgaSel) return;
  stateSel.addEventListener('change', () => {
    const list = STATE_LGA[stateSel.value] || [];
    lgaSel.innerHTML = `<option value="">${list.length ? 'Select…' : 'Select a state first'}</option>` + list.map(x => `<option>${x}</option>`).join('');
    lgaSel.disabled = list.length === 0;
    lgaSel.setAttribute('data-label', 'LGA');
  });
}

      <div class="mt-3">${body}</div>
    </div>
  </div>`;
  const b = $('#modalRoot [data-close]:not(.fixed)'); if (b) b.focus();
}
const closeModal = () => { $('#modalRoot').innerHTML = ''; };
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeModal(); });

function sendWhatsApp(message, done) {
  if (isPlaceholderNumber()) {
    openModal('WhatsApp number not set yet', `
      <p class="text-mute text-sm leading-relaxed">This site is in preview mode. Set <code>CONFIG.whatsappNumber</code> in the page script, and this message will open in WhatsApp instead. Here is the message that would be sent:</p>
      <pre class="mt-4 whitespace-pre-wrap text-sm bg-soft border border-line rounded-lg p-4 font-sans" id="previewMsg"></pre>`);
    $('#previewMsg').textContent = message;
    return false;
  }
  const url = waLink(message);
  const w = window.open(url, '_blank'); if (w) w.opener = null;
  toast(`${done || 'Opening WhatsApp…'} <a class="underline font-semibold text-amber-300" href="${url}" target="_blank" rel="noopener">Tap here if it did not open.</a>`, 10000);
  return true;
}

function buildMessage(form) {
  const to = form.dataset.to || 'Office';
  let msg = `Hello Barrister Smiles Azunda's ${to},\n\n`;
  if (form.dataset.topic) msg += `*Request:* ${form.dataset.topic}\n`;
  msg += $$('[data-label]', form).map(el => el.value.trim() ? `*${el.dataset.label}:* ${el.value.trim()}` : null).filter(Boolean).join('\n');
  return msg;
}

document.addEventListener('submit', e => {
  const form = e.target.closest('form[data-wa]'); if (!form) return;
  e.preventDefault();
  if (sendWhatsApp(buildMessage(form), 'Message ready in WhatsApp.')) form.reset();
});

document.addEventListener('click', e => {
  const chat = e.target.closest('[data-wa-chat]');
  if (chat) {
    const text = chat.dataset.waText || "Hello Barrister Smiles Azunda's Office, I would like to make an enquiry.";
    if (isPlaceholderNumber()) { e.preventDefault(); sendWhatsApp(text); }
    else chat.href = waLink(text);
    return;
  }
  const c = e.target.closest('[data-close]');
  if (c && (c === e.target || c.tagName === 'BUTTON' || c.closest('button'))) { closeModal(); return; }

  const amt = e.target.closest('[data-amount]');
  if (amt) { setSupport(amt.dataset.amount === 'custom' ? 'custom' : +amt.dataset.amount); return; }
  const pay = e.target.closest('[data-pay]');
  if (pay) payClick();
});
document.addEventListener('input', e => { if (e.target.id === 'customAmount') setSupport('custom', true); });

/* =====================================================================
   SUPPORT / DONATIONS — dual currency (NGN + live USD estimate)
   ===================================================================== */
let supportAmount = 25000;
const naira = n => '₦' + Number(n).toLocaleString('en-NG');
const dollars = n => '$' + Number(n).toLocaleString('en-US', { maximumFractionDigits: 2 });
function currentAmount() { return supportAmount === 'custom' ? Math.floor(+($('#customAmount') || {}).value || 0) : supportAmount; }
function setSupport(v, keepFocus) {
  supportAmount = v;
  $$('[data-amount]').forEach(b => b.setAttribute('aria-pressed', String((b.dataset.amount === 'custom' ? 'custom' : +b.dataset.amount) === v)));
  const cw = $('#customWrap'); if (cw) cw.classList.toggle('hidden', v !== 'custom');
  if (v === 'custom' && !keepFocus) { const ci = $('#customAmount'); if (ci) ci.focus(); }
  const a = currentAmount(), s = $('#donateSummary'), u = $('#donateUsd');
  if (s) s.textContent = a >= 100 ? `Your contribution: ${naira(a)}` : 'Enter an amount of at least ₦100.';
  if (u) u.textContent = a >= 100 ? `Estimated in US dollars: ≈ ${dollars(a / CONFIG.ngnPerUsd)}` : '';
}
function payClick() {
  const a = currentAmount();
  if (a < 100) { toast('Choose or enter an amount of at least ₦100 first.', 4000); return; }
  if (CONFIG.flutterwaveLink) { window.open(CONFIG.flutterwaveLink, '_blank', 'noopener'); return; }
  openModal('Card payment is not connected yet', `
    <p class="text-mute leading-relaxed">Online card payment will be switched on once a payment link is added (<code>CONFIG.flutterwaveLink</code>). Until then, please give by bank transfer using the details on this page.</p>
    <p class="mt-3 font-semibold">Amount you selected: ${naira(a)} (≈ ${dollars(a / CONFIG.ngnPerUsd)})</p>
    <button type="button" data-close class="btn btn-green mt-5">Got it</button>`);
}

/* ---------- Boot ---------- */
renderShell();
route();
})();
</script>
</body>
</html>
